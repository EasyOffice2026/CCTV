[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cctv-cloud"
version = "0.1.0"
description = "Multi-tenant cloud platform for the AI CCTV system"
requires-python = ">=3.12"
# cctv-contracts is a local package: install ../contracts first (see docs/dev-setup.md).
dependencies = [
    "cctv-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "cryptography>=43",
    "boto3>=1.35",
    "redis>=5.2",
    "python-multipart>=0.0.20",
    # Alerts: WhatsApp Cloud API and Web Push requests.
    "httpx>=0.27",
    # Reports: PDF (with Arabic shaping) and Excel.
    "reportlab>=4.2",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.5",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "fakeredis[lua]>=2.26"]

[tool.hatch.build.targets.wheel]
packages = ["cctv_cloud"]

[tool.pytest.ini_options]
testpaths = ["tests"]
