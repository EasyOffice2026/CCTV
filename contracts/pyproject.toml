[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cctv-contracts"
version = "0.1.0"
description = "Edge <-> cloud API contract (v1) for the AI CCTV system"
# The edge runs on Jetson (JetPack 6 / Ubuntu 22.04 ships Python 3.10).
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.9,<3",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/cctv_contracts"]
