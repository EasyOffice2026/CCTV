# Local development stack. Usage (from the repo root):
#   docker compose -f infra/docker-compose.yml up -d
# See docs/dev-setup.md. Dev-only credentials; never reuse them anywhere else.
name: cctv

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cctv_owner
      POSTGRES_PASSWORD: cctv_owner
      POSTGRES_DB: cctv
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cctv_owner -d cctv"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  # S3-compatible object storage for clips and snapshots.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cctv
      MINIO_ROOT_PASSWORD: cctv-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data

  # Edge <-> cloud messaging (config-change notifications).
  mqtt:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  # Simulated cameras: plays recorded footage from ml/data/footage as RTSP streams.
  sim-cameras:
    image: bluenviron/mediamtx:latest-ffmpeg
    ports: ["8554:8554", "8889:8889"]
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ../ml/data/footage:/footage:ro

  # Creates the media bucket once. Objects expire after 400 days as a backstop to the
  # retention worker (tenants can keep media for at most 365 days by default).
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >-
      sh -c "until mc alias set local http://minio:9000 cctv cctv-dev-secret; do sleep 1; done
      && mc mb --ignore-existing local/cctv-media
      && mc ilm rule add --expire-days 400 local/cctv-media || true"

  api:
    build:
      context: ..
      dockerfile: cloud/Dockerfile
    environment: &cloud-env
      CCTV_ENVIRONMENT: dev
      CCTV_DATABASE_URL: postgresql+psycopg://cctv_app:cctv_app@postgres:5432/cctv
      CCTV_MIGRATION_DATABASE_URL: postgresql+psycopg://cctv_owner:cctv_owner@postgres:5432/cctv
      CCTV_REDIS_URL: redis://redis:6379/0
      # Pre-signed URLs are opened by browsers and edge devices on the host, so they must
      # name the host's address for MinIO (signing doesn't contact MinIO).
      CCTV_S3_ENDPOINT_URL: http://localhost:9000
      # Webhooks may go to a receiver on this machine or LAN while developing (plan 8.4).
      CCTV_WEBHOOK_ALLOW_PRIVATE: "true"
    # Behind the web container's proxy: take the client IP from X-Forwarded-For (dev only;
    # in production list the proxy's address instead of *).
    command: ["sh", "-c", "alembic upgrade head && uvicorn cctv_cloud.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"]
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy

  # Alert and webhook retries, reports, absences, retention and offline-device jobs.
  worker:
    build:
      context: ..
      dockerfile: cloud/Dockerfile
    environment:
      <<: *cloud-env
      CCTV_S3_ENDPOINT_URL: http://minio:9000  # deletes objects, so it talks to MinIO itself
    command: ["python", "-m", "cctv_cloud.worker", "run"]
    depends_on:
      api:
        condition: service_started

  # Web dashboard on http://localhost:3000; proxies /v1 to the API (same origin).
  web:
    build:
      context: ../web
    environment:
      API_UPSTREAM: http://api:8000
      MEDIA_ORIGIN: http://localhost:9000
      # Sites allowed to frame /embed/ pages (plan 8), e.g. the ops system's origin.
      EMBED_ANCESTORS: ""
    ports: ["3000:8080"]
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  miniodata:
