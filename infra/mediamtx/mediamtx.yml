# Simulated cameras for development (plan Phase 1.3).
#
# Put recorded footage in ml/data/footage/ (git-ignored), then read it as RTSP:
#
#   ml/data/footage/ch1.mp4      -> rtsp://localhost:8554/Streaming/Channels/101  (main)
#                                -> rtsp://localhost:8554/Streaming/Channels/102  (sub)
#   ml/data/footage/kitchen.mp4  -> rtsp://localhost:8554/kitchen
#
# The first form mimics Hikvision NVR URLs, so edge configs look the same in dev and on site.
# Streams start when the first reader connects and loop forever.

logLevel: info
rtspAddress: :8554
webrtcAddress: :8889
rtmp: no
hls: no
srt: no
api: no

paths:
  '~^Streaming/Channels/(\d+)0[12]$':
    runOnDemand: >-
      ffmpeg -hide_banner -loglevel error -re -stream_loop -1
      -i /footage/ch$G1.mp4 -c copy -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnDemandRestart: yes

  '~^[A-Za-z0-9_-]+$':
    runOnDemand: >-
      ffmpeg -hide_banner -loglevel error -re -stream_loop -1
      -i /footage/$MTX_PATH.mp4 -c copy -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnDemandRestart: yes
