name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.17.3"
      - run: ruff check .
      - run: ruff format --check .

  contracts:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # 3.10 = Jetson (JetPack 6), 3.12 = cloud
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e "contracts[test]"
      - run: pytest contracts

  edge:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # 3.10 = Jetson (JetPack 6), 3.12 = newer dev machines
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -e contracts -e "edge[test]"
      - run: pytest
        working-directory: edge

  cloud:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cctv_owner
          POSTGRES_PASSWORD: cctv_owner
          POSTGRES_DB: cctv_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cctv_owner -d cctv_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CCTV_TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://cctv_owner:cctv_owner@localhost:5432/cctv_test
      CCTV_TEST_DATABASE_URL: postgresql+psycopg://cctv_app:cctv_app@localhost:5432/cctv_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create restricted app role
        run: >-
          PGPASSWORD=cctv_owner psql -h localhost -U cctv_owner -d cctv_test
          -c "CREATE ROLE cctv_app LOGIN PASSWORD 'cctv_app' NOSUPERUSER NOBYPASSRLS"
      # The edge package too: one test runs the real edge client against the API.
      - run: pip install -e contracts -e edge -e "cloud[test]"
      - run: pytest
        working-directory: cloud

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: API types match cloud/openapi.json
        run: npm run api:types && git diff --exit-code src/api/schema.d.ts
      - run: npm run lint
      - run: npm test
      - run: npm run build  # includes the TypeScript check

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f cloud/Dockerfile -t cctv-api:ci .
      - run: docker build -f edge/Dockerfile -t cctv-edge:ci .
      - run: docker build -t cctv-web:ci web
