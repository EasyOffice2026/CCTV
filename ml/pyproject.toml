[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cctv-ml"
version = "0.1.0"
description = "Dataset split, labelling export and evaluation tools for the AI CCTV models"
requires-python = ">=3.10"
# cctv-contracts is a local package: install ../contracts first (see docs/dev-setup.md).
# Standard library only otherwise; training code comes once the model licence is decided.
dependencies = ["cctv-contracts"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["cctv_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
